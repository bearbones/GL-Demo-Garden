<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#241e35" />
  <title>GL Demo Garden</title>
</head>
<body>
  <main id="stage" aria-label="Interactive demo"></main>
  <div id="garden-ui">
    <div class="garden-frame" aria-hidden="true">
      <span class="vine-rail vine-rail-left"></span>
      <span class="vine-rail vine-rail-right"></span>
      <span class="vine-corner vine-top-left"></span>
      <span class="vine-corner vine-top-right"></span>
      <span class="vine-corner vine-bottom-left"></span>
      <span class="vine-corner vine-bottom-right"></span>
    </div>
    <header class="garden-bar">
      <button id="drawer-toggle" aria-controls="garden-drawer" aria-expanded="true" title="Open or close tools">
        <img class="garden-mark" src="/src/ui/ornaments/garden-crest.svg" alt="" aria-hidden="true" />
        <span>Demo Garden</span><span class="toggle-glyph" aria-hidden="true">−</span>
      </button>
      <button id="hide-ui" title="Hide interface (H)" aria-label="Hide interface">Hide <kbd>H</kbd></button>
    </header>
    <aside id="garden-drawer" aria-label="Demo tools">
      <div class="demo-picker">
        <label for="demo-select">Now playing</label>
        <select id="demo-select" aria-label="Switch demo"></select>
        <p id="demo-hint"></p>
      </div>
      <div id="demo-controls"></div>
      <footer class="garden-footer">
        <button id="reset-demo" title="Restart this demo with its default settings">Restart</button>
        <button id="fullscreen" aria-pressed="false">Full screen</button>
      </footer>
    </aside>
  </div>
  <button id="restore-ui" hidden aria-label="Show controls" title="Show controls (H)">Controls <kbd>H</kbd></button>
  <p id="gl-error" role="alert" hidden></p>
  <script>
    window.addEventListener('error', function(e) {
      var el = document.getElementById('gl-error');
      if (el) { el.textContent = 'The demo could not render: ' + e.message; el.hidden = false; }
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
